<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - Mathematics & Physics Self-Study</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            background: #f8f8f8; 
            color: #222;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main { 
            flex: 1;
            max-width: 400px; 
            margin: 2rem auto;
            padding: 0 2rem;
        }
        .content-box {
            background: #fff; 
            padding: 2rem; 
            border-radius: 8px; 
            box-shadow: 0 2px 8px #ccc;
            margin-bottom: 2rem;
        }
        h1, h2 { margin-top: 0; }
        button { 
            width: 100%;
            margin-top: 1.5rem; 
            padding: 0.75rem 1rem; 
            background: #2d3e50; 
            color: #fff; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        button:hover { 
            background: #1a2533; 
        }
        .error-message {
            color: #e74c3c;
            margin-top: 1rem;
            display: none;
            padding: 1rem;
            background: #fde8e8;
            border-radius: 4px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #2d3e50;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .github-icon {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <main>
        <a href="index.html" class="back-link">← Back to Blog</a>
        <section class="content-box">
            <h2>Admin Login</h2>
            <div id="error-message" class="error-message">
                Authentication failed. Make sure you're the repository owner.
            </div>
            <button onclick="startGitHubAuth()">
                <svg class="github-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.335-1.755-1.335-1.755-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.605-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12c0-6.63-5.37-12-12-12"/>
                </svg>
                Sign in with GitHub
            </button>
        </section>
    </main>

    <script>
        // GitHub OAuth Configuration
        const clientId = 'YOUR_CLIENT_ID'; // You'll need to replace this
        const redirectUri = window.location.origin + '/login-callback.html';
        const owner = 'kimolas';
        const repo = 'kimolas.github.io';

        async function startGitHubAuth() {
            // Generate and store a random state value for security
            const state = Math.random().toString(36).substring(7);
            localStorage.setItem('github_auth_state', state);

            // Redirect to GitHub OAuth
            const authUrl = `https://github.com/login/oauth/authorize?` +
                `client_id=${clientId}` +
                `&redirect_uri=${encodeURIComponent(redirectUri)}` +
                `&scope=repo` +
                `&state=${state}`;
            
            window.location.href = authUrl;
        }

        // Check if there's an error from the callback
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            document.getElementById('error-message').style.display = 'block';
        }

        // Check if already authenticated and verify ownership
        async function checkAuth() {
            const token = localStorage.getItem('github_token');
            if (token) {
                try {
                    // Verify that the authenticated user is the repo owner
                    const response = await fetch('https://api.github.com/user', {
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });
                    
                    if (response.ok) {
                        const user = await response.json();
                        if (user.login === owner) {
                            window.location.href = 'hidden-admin.html';
                            return;
                        }
                    }
                    
                    // If we get here, either the token is invalid or user is not owner
                    localStorage.removeItem('github_token');
                } catch (error) {
                    console.error('Auth check failed:', error);
                }
            }
        }

        checkAuth();
    </script>
</body>
</html>

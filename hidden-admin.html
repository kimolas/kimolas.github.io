<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hidden Blog Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin:0; background:#f8f8f8; color:#222 }
        main { max-width:1200px; margin:2rem auto; padding:0 1.25rem }
        .content-box{ background:#fff; padding:1.5rem; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.08); margin-bottom:1.5rem }
        .admin-controls{ margin-bottom:1rem }
        .blog-list{ list-style:none; padding:0; margin:0 }
        input#title { width:100%; padding:0.6rem; font-size:1.05rem; box-sizing:border-box; margin-top:0.5rem }
        textarea#content { width:100%; min-height:50vh; max-height:75vh; padding:0.75rem; font-size:1rem; line-height:1.5; box-sizing:border-box; resize:vertical; font-family: 'Segoe UI', 'Courier New', monospace; margin-top:0.5rem }
        .preview{ margin-top:1rem; padding:1rem; border:1px solid #eee; border-radius:4px; background:#fafafa; max-height:60vh; overflow:auto }
        button { margin-right:0.5rem }
        .admin-controls .right { float:right }
        @media (max-width:700px){ main{padding:0.5rem} }
    </style>
</head>
<body>
    <main>
        <section class="content-box">
            <h2>Hidden Blog Admin</h2>
            <div class="admin-controls">
                <div class="left">
                    <button id="edit-mode-button" onclick="toggleEditMode()">Enable Edit Mode</button>
                    <button id="save-changes-button" onclick="saveChanges()" style="display:none">Save Changes</button>
                    <button id="cancel-changes-button" onclick="cancelChanges()" style="display:none">Cancel</button>
                </div>
                <div class="right" id="publish-controls"></div>
                <div style="clear:both"></div>
            </div>
            <div class="blog-posts">
                <ul class="blog-list" id="blog-list"></ul>
            </div>
        </section>

        <section class="content-box">
            <h3>New Blog Post</h3>
            <form id="blog-form">
                <label for="title">Title</label>
                <input type="text" id="title" required>
                <label for="content">Content</label>
                <textarea id="content" rows="6" required></textarea>
                <div class="preview"><h4>Preview</h4><div id="preview-content"></div></div>
                    <div style="margin-top:0.75rem"><button type="submit" id="add-post-button">Add Post</button></div>
            </form>
        </section>
    </main>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
    <script src="katex-macros.js"></script>
    <script src="posts.js"></script>

    <script>
        // Lightweight admin app: EasyMDE editor, live preview (marked) + KaTeX rendering, localStorage CRUD, publish/download helpers
        let posts = [];
        let editMode = false;
        
        function renderMathInElSafe(el){
            if (typeof renderMathInElement === 'function'){
                try{
                    renderMathInElement(el, {
                        delimiters: [{left:'$$', right:'$$', display:true}, {left:'$', right:'$', display:false}],
                        throwOnError: false,
                        macros: (typeof katexMacros !== 'undefined' ? katexMacros : {})
                    });
                }catch(e){ console.error('KaTeX render error', e); }
            }
        }

        function initializeKaTeX(){ renderMathInElSafe(document.body); }

        function loadPosts(){
            const loaded = [];
            if (typeof defaultPosts !== 'undefined' && Array.isArray(defaultPosts)){
                defaultPosts.forEach(p => loaded.push({ title: p.title, content: p.content, createdAt: p.createdDate ? new Date(p.createdDate).toISOString() : new Date().toISOString(), editedAt: p.lastEdited ? new Date(p.lastEdited).toISOString() : null }));
            }
            try{
                const local = JSON.parse(localStorage.getItem('blog-posts') || '[]');
                if (Array.isArray(local)){
                    local.forEach(lp => {
                        const exists = loaded.some(fp => fp.title === lp.title && new Date(fp.createdAt).getTime() === new Date(lp.createdAt).getTime());
                        if (!exists) loaded.push(lp);
                    });
                }
            }catch(e){ console.error('Failed to parse local posts', e); }
            return loaded;
        }

        function displayPosts(){
            const blogList = document.getElementById('blog-list');
            if(!blogList) return;
            blogList.innerHTML = '';
            posts.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
            posts.forEach((post, idx) => {
                if (!post || !post.title || !post.content) return;
                const li = document.createElement('li');
                const article = document.createElement('article'); article.className = 'blog-post';
                const h3 = document.createElement('h3'); h3.textContent = post.title; article.appendChild(h3);
                const dates = document.createElement('div');
                dates.innerHTML = `<small>Created: ${new Date(post.createdAt).toLocaleString()}</small>${post.editedAt?`<br><small>Last edited: ${new Date(post.editedAt).toLocaleString()}</small>`:''}`;
                article.appendChild(dates);
                const content = document.createElement('div'); content.className = 'post-content';
                // render markdown to HTML for preview in admin list
                const html = (typeof marked.parse === 'function') ? marked.parse(post.content) : post.content;
                content.innerHTML = html;
                article.appendChild(content);
                if (editMode){
                    const ctrls = document.createElement('div'); ctrls.className='edit-controls';
                    const ebtn = document.createElement('button'); ebtn.textContent='Edit'; ebtn.onclick = () => editPost(idx);
                    const dbtn = document.createElement('button'); dbtn.textContent='Delete'; dbtn.onclick = () => deletePost(idx);
                    ctrls.appendChild(ebtn); ctrls.appendChild(dbtn); article.appendChild(ctrls);
                }
                li.appendChild(article); blogList.appendChild(li);
            });
            renderMathInElSafe(document.getElementById('blog-list') || document.body);
        }

        function editPost(index){
            const post = posts[index];
            document.getElementById('title').value = post.title;
            if (window.easymdeInstance) window.easymdeInstance.value(post.content); else document.getElementById('content').value = post.content;
            document.getElementById('preview-content').innerHTML = (typeof marked.parse === 'function') ? marked.parse(post.content) : post.content;
            posts.splice(index,1);
            post.editedAt = new Date().toISOString();
            localStorage.setItem('blog-posts', JSON.stringify(posts));
            displayPosts(); renderMathInElSafe(document.getElementById('preview-content'));
        }

        function deletePost(index){ if (confirm('Are you sure you want to delete this post?')){ posts.splice(index,1); localStorage.setItem('blog-posts', JSON.stringify(posts)); displayPosts(); } }

        function toggleEditMode(){ editMode = !editMode; document.getElementById('edit-mode-button').textContent = editMode ? 'Disable Edit Mode' : 'Enable Edit Mode'; document.getElementById('save-changes-button').style.display = editMode ? 'inline' : 'none'; document.getElementById('cancel-changes-button').style.display = editMode ? 'inline' : 'none'; displayPosts(); }
        function saveChanges(){ localStorage.setItem('blog-posts', JSON.stringify(posts)); toggleEditMode(); }
        function cancelChanges(){ posts = loadPosts(); toggleEditMode(); }

        // Editor setup and wiring
        (function(){
            function setupEditor(){
                try{
                    const easymde = new EasyMDE({
                        element: document.getElementById('content'),
                        spellChecker: false,
                        autosave: { enabled: false },
                        toolbar: ["bold","italic","heading","|","quote","unordered-list","ordered-list","|","link","image","|","preview","side-by-side","fullscreen"],
                        previewRender: function(plainText, preview){
                            const html = (typeof marked.parse === 'function') ? marked.parse(plainText) : plainText;
                            preview.innerHTML = html;
                            renderMathInElSafe(preview);
                            return preview.innerHTML;
                        }
                    });
                    window.easymdeInstance = easymde;
                }catch(e){ console.error('Failed to init EasyMDE:', e); }
            }

            function wireEvents(){
                const form = document.getElementById('blog-form');
                const previewContainer = document.getElementById('preview-content');
                const addBtn = document.getElementById('add-post-button');

                function addPost(e){
                    if(e && typeof e.preventDefault === 'function') e.preventDefault();
                    try{
                        const title = (document.getElementById('title') && document.getElementById('title').value) ? document.getElementById('title').value.trim() : '';
                        const content = (window.easymdeInstance ? window.easymdeInstance.value() : (document.getElementById('content') ? document.getElementById('content').value : ''));
                        console.log('addPost invoked', { title: !!title, contentLength: content ? content.length : 0 });
                        if (title && content){
                            posts.push({ title, content, createdAt: new Date().toISOString(), editedAt: null });
                            localStorage.setItem('blog-posts', JSON.stringify(posts));
                            if (document.getElementById('title')) document.getElementById('title').value = '';
                            if (window.easymdeInstance) window.easymdeInstance.value(''); else if (document.getElementById('content')) document.getElementById('content').value = '';
                            previewContainer.innerHTML = '';
                            displayPosts();
                            renderMathInElSafe(previewContainer);
                        } else {
                            console.warn('addPost: missing title or content');
                        }
                    }catch(err){ console.error('addPost error', err); }
                }

                if(form) form.addEventListener('submit', addPost);
                if(addBtn) addBtn.addEventListener('click', addPost);

                const updatePreview = () => {
                    try{
                        const md = window.easymdeInstance ? window.easymdeInstance.value() : document.getElementById('content').value;
                        const html = (typeof marked.parse === 'function') ? marked.parse(md) : md;
                        previewContainer.innerHTML = html;
                        renderMathInElSafe(previewContainer);
                    }catch(err){ console.error('Preview update failed:', err); }
                };

                if (window.easymdeInstance && window.easymdeInstance.codemirror){
                    window.easymdeInstance.codemirror.on('change', updatePreview);
                } else {
                    const ta = document.getElementById('content'); if (ta) ta.addEventListener('input', updatePreview);
                }
            }

            document.addEventListener('DOMContentLoaded', function(){
                setupEditor();
                wireEvents();
                posts = loadPosts();
                // start in edit mode since this is an admin page
                editMode = true;
                document.getElementById('edit-mode-button').textContent = 'Disable Edit Mode';
                document.getElementById('save-changes-button').style.display = 'inline';
                document.getElementById('cancel-changes-button').style.display = 'inline';
                displayPosts();
            });
        })();

        // GitHub publisher helper
        class GitHubPublisher{
            constructor(){ this.token = localStorage.getItem('github_token'); this.owner = 'kimolas'; this.repo = 'kimolas.github.io'; this.branch = 'main'; }
            async publishPosts(){
                if(!this.token){ const token = prompt('Please enter your GitHub token (repo scope required)'); if(!token) return; this.token = token; localStorage.setItem('github_token', token); }
                try{
                    const currentFile = await this.getFile('posts.js');
                    const postsForFile = posts.map(post => ({ title: post.title, content: post.content, createdDate: new Date(post.createdAt).toISOString().split('T')[0], lastEdited: post.editedAt ? new Date(post.editedAt).toISOString().split('T')[0] : null }));
                    const newContent = `// To add a new post, copy the format below and add it to the top of the list.\n// The date is optional but recommended.\nconst defaultPosts = ${JSON.stringify(postsForFile, null, 4)};`;
                    await this.updateFile('posts.js', newContent, currentFile.sha);
                    alert('Successfully published to GitHub!');
                }catch(err){ console.error('Error publishing to GitHub:', err); alert('Failed to publish to GitHub (see console).'); if(err.status === 401) localStorage.removeItem('github_token'); }
            }
            async getFile(path){ const r = await fetch(`https://api.github.com/repos/${this.owner}/${this.repo}/contents/${path}`, { headers: { 'Authorization': `token ${this.token}`, 'Accept': 'application/vnd.github.v3+json' } }); if(!r.ok) throw r; return r.json(); }
            async updateFile(path, content, sha){ const r = await fetch(`https://api.github.com/repos/${this.owner}/${this.repo}/contents/${path}`, { method:'PUT', headers:{ 'Authorization': `token ${this.token}`, 'Accept':'application/vnd.github.v3+json', 'Content-Type':'application/json' }, body: JSON.stringify({ message: 'Update blog posts', content: btoa(unescape(encodeURIComponent(content))), sha: sha, branch: this.branch }) }); if(!r.ok) throw r; return r.json(); }
        }

        // add publish and download buttons into publish-controls
        const publisher = new GitHubPublisher();
        const publishButton = document.createElement('button'); publishButton.textContent = 'Publish to GitHub'; publishButton.onclick = () => publisher.publishPosts();
        const downloadButton = document.createElement('button'); downloadButton.textContent = 'Download posts.js';
        downloadButton.onclick = function(){
            const postsForFile = posts.map(post => ({ title: post.title, content: post.content, createdDate: new Date(post.createdAt).toISOString().split('T')[0], lastEdited: post.editedAt ? new Date(post.editedAt).toISOString().split('T')[0] : null }));
            const fileContent = `// To add a new post, copy the format below and add it to the top of the list.\n// The date is optional but recommended.\nconst defaultPosts = ${JSON.stringify(postsForFile, null, 4)};`;
            const blob = new Blob([fileContent], { type: 'text/javascript' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'posts.js'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
        };
        // append controls after DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            const pc = document.getElementById('publish-controls'); if(pc){ pc.appendChild(publishButton); pc.appendChild(downloadButton); }
        });
    </script>
</body>
</html>

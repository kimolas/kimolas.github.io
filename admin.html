<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog Admin - Mathematics & Physics Self-Study</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- KaTeX dependencies -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            background: #f8f8f8; 
            color: #222;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main { 
            flex: 1;
            max-width: 1400px; 
            margin: 2rem auto;
            padding: 0 2rem;
        }
        .content-box {
            background: #fff; 
            padding: 2rem; 
            border-radius: 8px; 
            box-shadow: 0 2px 8px #ccc;
            margin-bottom: 2rem;
            min-width: 0;
        }
        h1, h2, h3 { margin-top: 0; }
        .blog-list { 
            list-style: none; 
            padding: 0;
            margin: 0;
        }
        .blog-post { 
            border-top: 1px solid #eee; 
            padding-top: 1.5rem; 
            margin-top: 1.5rem; 
        }
        .post-content p { margin: 0.5em 0; }
        .post-content p:empty { display: none; }
        .math-display { margin: 1em 0; text-align: center; }
        .katex-display { 
            overflow-x: auto; 
            overflow-y: hidden; 
            padding: 1em 0; 
        }
        .katex { text-rendering: auto; }
        label { display: block; margin-top: 1rem; }
        input, textarea { 
            width: 100%; 
            padding: 0.5rem; 
            margin-top: 0.5rem; 
            box-sizing: border-box;
        }
        button { 
            margin-top: 1rem; 
            padding: 0.5rem 1rem; 
            background: #2d3e50; 
            color: #fff; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        button:hover { background: #1a2533; }
        .admin-controls {
            margin-bottom: 1rem;
        }
        .edit-controls button {
            margin-right: 0.5rem;
        }
        .preview {
            margin-top: 1rem;
            padding: 1rem;
            border: 1px solid #eee;
            border-radius: 4px;
            background: #fafafa;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #2d3e50;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main>
        <a href="index.html" class="back-link">← Back to Blog</a>
        <section class="content-box">
            <h2>Blog Admin</h2>
            <div class="admin-controls">
                <button onclick="toggleEditMode()" id="edit-mode-button">Enable Edit Mode</button>
                <button onclick="saveChanges()" id="save-changes-button" style="display: none;">Save Changes</button>
                <button onclick="cancelChanges()" id="cancel-changes-button" style="display: none;">Cancel</button>
            </div>
            <div class="blog-posts">
                <ul class="blog-list" id="blog-list">
                    <!-- Blog posts will appear here -->
                </ul>
            </div>
        </section>
        <section class="content-box">
            <h3>New Blog Post</h3>
            <form id="blog-form">
                <label for="title">Title</label>
                <input type="text" id="title" required>
                <label for="content">Content</label>
                <textarea id="content" rows="5" required></textarea>
                <div class="preview">
                    <h4>Preview</h4>
                    <div id="preview-content"></div>
                </div>
                <button type="submit">Add Post</button>
            </form>
        </section>
    </main>

    <script>
        // Global variables
        let posts = [];
        let editMode = false;
        
        // Function to display posts
        function displayPosts() {
            console.log('Displaying posts...');
            const blogList = document.getElementById('blog-list');
            if (!blogList) {
                console.error('Blog list element not found!');
                return;
            }
            
            if (!Array.isArray(posts)) {
                console.error('Posts is not an array:', posts);
                return;
            }
            
            blogList.innerHTML = '';
            console.log('Number of posts to display:', posts.length);
            
            // Sort posts by creation date
            posts.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            
            posts.forEach((post, index) => {
                if (!post || !post.title || !post.content) {
                    console.warn('Invalid post data at index', index, post);
                    return;
                }
                
                const li = document.createElement('li');
                const article = document.createElement('article');
                article.className = 'blog-post';
                article.dataset.index = index;
                
                const header = document.createElement('h3');
                header.textContent = post.title;
                article.appendChild(header);
                
                const dates = document.createElement('div');
                dates.innerHTML = `
                    <small>Created: ${new Date(post.createdAt).toLocaleDateString()}</small>
                    ${post.editedAt ? `<br><small>Last edited: ${new Date(post.editedAt).toLocaleDateString()}</small>` : ''}
                `;
                article.appendChild(dates);
                
                const content = document.createElement('div');
                content.className = 'post-content';
                content.innerHTML = post.content;
                article.appendChild(content);
                
                if (editMode) {
                    const controls = document.createElement('div');
                    controls.className = 'edit-controls';
                    
                    const editButton = document.createElement('button');
                    editButton.textContent = 'Edit';
                    editButton.onclick = () => editPost(index);
                    
                    const deleteButton = document.createElement('button');
                    deleteButton.textContent = 'Delete';
                    deleteButton.onclick = () => deletePost(index);
                    
                    controls.appendChild(editButton);
                    controls.appendChild(deleteButton);
                    article.appendChild(controls);
                }
                
                li.appendChild(article);
                blogList.appendChild(li);
            });
            
            // Initialize KaTeX for the new content
            initializeKaTeX();
        }

        // Function to initialize KaTeX
        function initializeKaTeX() {
            const options = {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false}
                ],
                throwOnError: false,
                output: 'html',
                strict: false,
                macros: {
                    "\\Ker": "\\operatorname{Ker}",
                    "\\Ima": "\\operatorname{Im}",
                    "\\Hom": "\\operatorname{Hom}",
                    "\\End": "\\operatorname{End}",
                    "\\Aut": "\\operatorname{Aut}",
                    "\\Mor": "\\operatorname{Mor}",
                    "\\Ob": "\\operatorname{Ob}",
                    "\\id": "\\operatorname{id}",
                    "\\Spec": "\\operatorname{Spec}",
                    "\\Proj": "\\operatorname{Proj}",
                    "\\Sing": "\\operatorname{Sing}",
                    "\\Smooth": "\\operatorname{Smooth}",
                    "\\Normal": "\\operatorname{Normal}",
                    "\\Ann": "\\operatorname{Ann}",
                    "\\tr": "\\operatorname{tr}",
                    "\\rk": "\\operatorname{rk}",
                    "\\GL": "\\operatorname{GL}",
                    "\\SL": "\\operatorname{SL}",
                    "\\SO": "\\operatorname{SO}",
                    "\\Sp": "\\operatorname{Sp}",
                    "\\PSL": "\\operatorname{PSL}",
                    "\\GF": "\\operatorname{GF}",
                    "\\R": "\\mathbb{R}",
                    "\\C": "\\mathbb{C}",
                    "\\Z": "\\mathbb{Z}",
                    "\\Q": "\\mathbb{Q}",
                    "\\N": "\\mathbb{N}",
                    "\\F": "\\mathbb{F}"
                }
            };
            
            if (typeof renderMathInElement === 'function') {
                try {
                    renderMathInElement(document.body, options);
                } catch (error) {
                    console.error('Error rendering math:', error);
                }
            } else {
                console.warn('KaTeX not loaded yet, retrying...');
                setTimeout(initializeKaTeX, 100);
            }
        }

        // Blog post handling
        function loadPosts() {
            console.log('Starting post loading process...');
            
            // First try to load posts from posts.js
            let loadedPosts = [];
            if (typeof defaultPosts !== 'undefined' && Array.isArray(defaultPosts)) {
                console.log('Found posts.js data:', defaultPosts.length, 'posts');
                loadedPosts = defaultPosts.map(post => ({
                    title: post.title,
                    content: post.content,
                    createdAt: post.createdDate ? new Date(post.createdDate).toISOString() : new Date().toISOString(),
                    editedAt: post.lastEdited ? new Date(post.lastEdited).toISOString() : null
                }));
            } else {
                console.warn('posts.js data not found or invalid');
            }

            // Then try to load from localStorage
            try {
                const localPosts = JSON.parse(localStorage.getItem('blog-posts') || '[]');
                console.log('Found localStorage data:', localPosts.length, 'posts');
                
                // Add local posts that don't exist in posts.js
                localPosts.forEach(localPost => {
                    const exists = loadedPosts.some(filePost => 
                        filePost.title === localPost.title && 
                        new Date(filePost.createdAt).getTime() === new Date(localPost.createdAt).getTime()
                    );
                    if (!exists) {
                        loadedPosts.push(localPost);
                    }
                });
            } catch (error) {
                console.error('Error loading from localStorage:', error);
            }

            return loadedPosts;
        }

        // Edit and delete functions
        function editPost(index) {
            const post = posts[index];
            document.getElementById('title').value = post.title;
            document.getElementById('content').value = post.content;
            document.getElementById('preview-content').innerHTML = post.content;
            
            // Remove the old post
            posts.splice(index, 1);
            
            // Update edited time
            post.editedAt = new Date().toISOString();
            
            // Save and refresh
            localStorage.setItem('blog-posts', JSON.stringify(posts));
            displayPosts();
            initializeKaTeX();
        }

        function deletePost(index) {
            if (confirm('Are you sure you want to delete this post?')) {
                posts.splice(index, 1);
                localStorage.setItem('blog-posts', JSON.stringify(posts));
                displayPosts();
            }
        }

        function toggleEditMode() {
            editMode = !editMode;
            const editModeButton = document.getElementById('edit-mode-button');
            const saveChangesButton = document.getElementById('save-changes-button');
            const cancelChangesButton = document.getElementById('cancel-changes-button');
            
            editModeButton.textContent = editMode ? 'Disable Edit Mode' : 'Enable Edit Mode';
            saveChangesButton.style.display = editMode ? 'inline' : 'none';
            cancelChangesButton.style.display = editMode ? 'inline' : 'none';
            
            displayPosts();
        }

        function saveChanges() {
            localStorage.setItem('blog-posts', JSON.stringify(posts));
            toggleEditMode();
        }

        function cancelChanges() {
            posts = loadPosts();
            toggleEditMode();
        }

        // Add event listeners
        document.getElementById('blog-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            
            if (title && content) {
                posts.push({
                    title,
                    content,
                    createdAt: new Date().toISOString(),
                    editedAt: null
                });
                
                localStorage.setItem('blog-posts', JSON.stringify(posts));
                
                document.getElementById('title').value = '';
                document.getElementById('content').value = '';
                document.getElementById('preview-content').innerHTML = '';
                
                displayPosts();
                initializeKaTeX();
            }
        });

        document.getElementById('content').addEventListener('input', function(e) {
            const preview = document.getElementById('preview-content');
            preview.innerHTML = this.value;
            initializeKaTeX();
        });

        // Initialize
        function initialize() {
            console.log('Initializing application...');
            posts = loadPosts();
            console.log('Posts loaded:', posts.length);
            // Enable edit mode by default on admin page
            editMode = true;
            document.getElementById('edit-mode-button').textContent = 'Disable Edit Mode';
            document.getElementById('save-changes-button').style.display = 'inline';
            document.getElementById('cancel-changes-button').style.display = 'inline';
            displayPosts();
        }

        // Start the application
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }
    </script>
    <script src="posts.js"></script>
</body>
</html>
